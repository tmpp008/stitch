<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tasks List Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#A7C7E7",
              "background-light": "#F8F7FF",
              "background-dark": "#101a22",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style type="text/css">
      body {
        font-family: 'Inter', sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .material-symbols-outlined.fill {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative mx-auto flex h-screen min-h-screen w-full max-w-md flex-col overflow-hidden">
<!-- Top App Bar -->
<header class="flex shrink-0 items-center justify-between bg-background-light p-4 pt-6 dark:bg-background-dark">
<h1 class="text-3xl font-bold text-slate-900 dark:text-white">Tasks</h1>
<button class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full bg-slate-200/50 text-slate-600 dark:bg-slate-700/50 dark:text-slate-300">
<span class="material-symbols-outlined text-2xl">filter_list</span>
</button>
</header>
<!-- Task List -->
<main class="flex-1 overflow-y-auto p-4">
<div class="flex flex-col gap-3">
<!-- Task Card: High Priority -->
<div class="flex items-start gap-4 rounded-xl bg-white p-4 shadow-sm dark:bg-slate-800">
<input class="mt-1 h-5 w-5 flex-shrink-0 rounded-full border-2 border-slate-300 text-primary focus:ring-0 focus:ring-offset-0 dark:border-slate-600 dark:bg-slate-700 dark:checked:bg-primary dark:checked:border-primary" type="checkbox"/>
<div class="flex-1">
<p class="text-base font-medium text-slate-800 dark:text-slate-100">Design homepage mockup</p>
<div class="mt-1 flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400">
<span class="h-2 w-2 rounded-full" style="background-color: #FF6961;"></span>
<span>Today</span>
</div>
</div>
</div>
<!-- Task Card: No Priority -->
<div class="flex items-start gap-4 rounded-xl bg-white p-4 shadow-sm dark:bg-slate-800">
<input class="mt-1 h-5 w-5 flex-shrink-0 rounded-full border-2 border-slate-300 text-primary focus:ring-0 focus:ring-offset-0 dark:border-slate-600 dark:bg-slate-700 dark:checked:bg-primary dark:checked:border-primary" type="checkbox"/>
<div class="flex-1">
<p class="text-base font-medium text-slate-800 dark:text-slate-100">Call the vet</p>
<p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Tomorrow</p>
</div>
</div>
<!-- Task Card: Completed -->
<div class="flex items-start gap-4 rounded-xl bg-white p-4 opacity-60 shadow-sm dark:bg-slate-800">
<input checked="" class="mt-1 h-5 w-5 flex-shrink-0 rounded-full border-2 border-slate-300 text-primary focus:ring-0 focus:ring-offset-0 dark:border-slate-600 dark:bg-slate-700 dark:checked:bg-primary dark:checked:border-primary" type="checkbox"/>
<div class="flex-1">
<p class="text-base font-medium text-slate-500 line-through dark:text-slate-400">Buy groceries</p>
<p class="mt-1 text-sm text-slate-400 dark:text-slate-500">Yesterday</p>
</div>
</div>
<!-- Task Card: Medium Priority -->
<div class="flex items-start gap-4 rounded-xl bg-white p-4 shadow-sm dark:bg-slate-800">
<input class="mt-1 h-5 w-5 flex-shrink-0 rounded-full border-2 border-slate-300 text-primary focus:ring-0 focus:ring-offset-0 dark:border-slate-600 dark:bg-slate-700 dark:checked:bg-primary dark:checked:border-primary" type="checkbox"/>
<div class="flex-1">
<p class="text-base font-medium text-slate-800 dark:text-slate-100">Finalize Q3 report</p>
<div class="mt-1 flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400">
<span class="h-2 w-2 rounded-full" style="background-color: #FFB347;"></span>
<span>In 3 days</span>
</div>
</div>
</div>
</div>
</main>
<!-- FAB -->
<div class="absolute bottom-24 right-6">
<a href="edit-task.html" class="flex h-14 w-14 cursor-pointer items-center justify-center rounded-full bg-primary text-white shadow-lg">
<span class="material-symbols-outlined text-3xl">add</span>
</a>
</div>
<!-- Bottom Nav Bar -->
<footer class="flex shrink-0 border-t border-slate-200 bg-white/80 px-4 pb-4 pt-2 backdrop-blur-sm dark:border-slate-700 dark:bg-slate-900/80">
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-primary" href="index.html">
<span class="material-symbols-outlined fill">task_alt</span>
<p class="text-xs font-medium">Tasks</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-500 dark:text-slate-400" href="notes.html">
<span class="material-symbols-outlined">description</span>
<p class="text-xs font-medium">Notes</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-500 dark:text-slate-400" href="settings.html">
<span class="material-symbols-outlined">settings</span>
<p class="text-xs font-medium">Settings</p>
</a>
</footer>
</div>
</body></html>
