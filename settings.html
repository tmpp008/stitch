<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#A084E8",
              "background-light": "#F8F7FF",
              "background-dark": "#121212",
              "card-light": "#FFFFFF",
              "card-dark": "#1C1C1E",
              "text-primary-light": "#1C1C1E",
              "text-primary-dark": "#EAEAEA",
              "text-secondary-light": "#8A8A8E",
              "text-secondary-dark": "#98989D",
              "icon-bg-light": "#E8E8EB",
              "icon-bg-dark": "#2C2C2E",
              "danger": "#FF453A"
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative mx-auto flex h-auto min-h-screen w-full max-w-md flex-col overflow-x-hidden">
<!-- Main Content -->
<main class="flex-1 pb-28">
<!-- Top App Bar -->
<div class="flex flex-col gap-2 p-4 pt-10">
<p class="text-text-primary-light dark:text-text-primary-dark text-[34px] font-bold leading-tight tracking-tight">Settings</p>
</div>
<div class="flex flex-col gap-8 px-4">
<!-- Appearance Section -->
<div class="flex flex-col overflow-hidden rounded-xl bg-card-light dark:bg-card-dark">
<div class="flex items-center gap-4 px-4 min-h-[56px] justify-between border-b border-gray-200/80 dark:border-gray-700/60">
<div class="flex items-center gap-4">
<div class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#A084E8]">
<span class="material-symbols-outlined text-xl text-white">palette</span>
</div>
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal">Dark Mode</p>
</div>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full bg-icon-bg-light p-0.5 dark:bg-icon-bg-dark has-[:checked]:bg-primary">
<div class="h-full w-[27px] rounded-full bg-white transition-transform duration-300 ease-in-out" style="box-shadow: rgba(0, 0, 0, 0.15) 0px 3px 8px, rgba(0, 0, 0, 0.06) 0px 3px 1px;"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
</div>
<!-- Account/Sync Section -->
<div class="flex flex-col overflow-hidden rounded-xl bg-card-light dark:bg-card-dark">
<div class="flex items-center gap-4 px-4 min-h-[56px] justify-between border-b border-gray-200/80 dark:border-gray-700/60">
<div class="flex items-center gap-4">
<div class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#6DDCCF]">
<span class="material-symbols-outlined text-xl text-white">person</span>
</div>
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal">Account</p>
</div>
<div class="shrink-0">
<p class="text-text-secondary-light dark:text-text-secondary-dark text-base">user@example.com</p>
</div>
</div>
<div class="flex items-center gap-4 px-4 min-h-[56px] justify-between border-b border-gray-200/80 dark:border-gray-700/60">
<div class="flex items-center gap-4">
<div class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#34C759]">
<span class="material-symbols-outlined text-xl text-white">cloud_done</span>
</div>
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal">Sync Status</p>
</div>
<div class="shrink-0">
<p class="text-text-secondary-light dark:text-text-secondary-dark text-base">Synced just now</p>
</div>
</div>
<div class="flex cursor-pointer items-center gap-4 px-4 min-h-[56px] justify-center">
<p class="text-primary text-base font-medium leading-normal">Sign Out</p>
</div>
</div>
<!-- Data Management Section -->
<div class="flex flex-col overflow-hidden rounded-xl bg-card-light dark:bg-card-dark">
<div class="flex cursor-pointer items-center gap-4 px-4 min-h-[56px] justify-between">
<div class="flex items-center gap-4">
<div class="flex h-8 w-8 items-center justify-center rounded-lg bg-danger">
<span class="material-symbols-outlined text-xl text-white">delete_forever</span>
</div>
<p class="text-danger text-base font-medium leading-normal flex-1 truncate">Clear All Tasks &amp; Notes</p>
</div>
</div>
</div>
<!-- About Section -->
<div class="flex flex-col overflow-hidden rounded-xl bg-card-light dark:bg-card-dark">
<div class="flex items-center gap-4 px-4 min-h-[56px] justify-between border-b border-gray-200/80 dark:border-gray-700/60">
<div class="flex items-center gap-4">
<div class="flex h-8 w-8 items-center justify-center rounded-lg bg-icon-bg-light dark:bg-icon-bg-dark">
<span class="material-symbols-outlined text-xl text-text-secondary-light dark:text-text-secondary-dark">info</span>
</div>
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal">Version</p>
</div>
<div class="shrink-0">
<p class="text-text-secondary-light dark:text-text-secondary-dark text-base">1.0.0</p>
</div>
</div>
<div class="flex cursor-pointer items-center gap-4 px-4 min-h-[56px] justify-between">
<div class="flex items-center gap-4">
<div class="flex h-8 w-8 items-center justify-center rounded-lg bg-icon-bg-light dark:bg-icon-bg-dark">
<span class="material-symbols-outlined text-xl text-text-secondary-light dark:text-text-secondary-dark">shield</span>
</div>
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal">Privacy Policy</p>
</div>
<div class="shrink-0">
<span class="material-symbols-outlined text-xl text-text-secondary-light dark:text-text-secondary-dark opacity-50">arrow_forward_ios</span>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation -->
<div class="fixed bottom-0 left-0 right-0 mx-auto w-full max-w-md border-t border-gray-200/80 bg-background-light/80 backdrop-blur-lg dark:border-gray-700/60 dark:bg-background-dark/80">
<div class="flex h-[84px] items-start justify-around pt-2">
<a href="index.html" class="flex cursor-pointer flex-col items-center gap-1 text-center text-text-secondary-light dark:text-text-secondary-dark">
<span class="material-symbols-outlined text-2xl">task_alt</span>
<p class="text-xs font-medium">Tasks</p>
</a>
<a href="notes.html" class="flex cursor-pointer flex-col items-center gap-1 text-center text-text-secondary-light dark:text-text-secondary-dark">
<span class="material-symbols-outlined text-2xl">description</span>
<p class="text-xs font-medium">Notes</p>
</a>
<a href="settings.html" class="flex cursor-pointer flex-col items-center gap-1 text-center text-primary">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">settings</span>
<p class="text-xs font-bold">Settings</p>
</a>
</div>
</div>
</div>
</body></html>
