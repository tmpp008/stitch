<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Task Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#BDB2FF",
              "background-light": "#F8F7FF",
              "background-dark": "#101a22",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between bg-background-light dark:bg-background-dark">
<a href="index.html" class="text-[#424242] dark:text-white flex size-10 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-3xl">arrow_back_ios_new</span>
</a>
<h2 class="text-[#424242] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Edit Task</h2>
<div class="flex size-10 shrink-0 items-center"></div>
</div>
<div class="flex flex-col flex-1 px-4 pt-6 pb-8">
<!-- Task Title Card -->
<div class="bg-white dark:bg-black/20 rounded-xl p-4 shadow-sm mb-6">
<label class="flex flex-col w-full">
<p class="text-[#424242] dark:text-white/80 text-base font-medium leading-normal pb-2">Task Title</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#424242] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-white/20 bg-gray-50 dark:bg-white/10 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-white/40 p-[15px] text-base font-normal leading-normal" placeholder="What do you need to do?" value="Design the new homepage"/>
</label>
</div>
<!-- Task Details Card -->
<div class="bg-white dark:bg-black/20 rounded-xl shadow-sm">
<!-- Priority -->
<div class="p-4 border-b border-gray-200 dark:border-white/10">
<label class="flex flex-col w-full">
<p class="text-[#424242] dark:text-white/80 text-base font-medium leading-normal pb-2">Priority</p>
<div class="relative">
<select class="form-select appearance-none w-full rounded-lg text-[#424242] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-white/20 bg-gray-50 dark:bg-white/10 focus:border-primary h-14 placeholder:text-gray-400 p-[15px] text-base font-normal leading-normal">
<option>Low</option>
<option selected="">Medium</option>
<option>High</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 dark:text-white/60">
<span class="material-symbols-outlined">unfold_more</span>
</div>
</div>
</label>
</div>
<!-- Due Date -->
<div class="flex items-center gap-4 px-4 min-h-14 justify-between border-b border-gray-200 dark:border-white/10 py-3">
<div class="flex items-center gap-4">
<div class="text-[#424242] dark:text-white/80 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">calendar_today</span>
</div>
<p class="text-[#424242] dark:text-white text-base font-medium leading-normal flex-1 truncate">Due Date</p>
</div>
<div class="shrink-0 flex items-center gap-2">
<p class="text-[#424242] dark:text-white/80 text-base font-normal leading-normal">Dec 25, 2024</p>
<span class="material-symbols-outlined text-gray-400 dark:text-white/50">arrow_forward_ios</span>
</div>
</div>
<!-- Reminder Toggle -->
<div class="flex items-center gap-4 px-4 min-h-14 justify-between py-3">
<div class="flex items-center gap-4">
<div class="text-[#424242] dark:text-white/80 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">notifications</span>
</div>
<p class="text-[#424242] dark:text-white text-base font-medium leading-normal flex-1 truncate">Set Reminder</p>
</div>
<div class="shrink-0">
<label class="relative inline-flex cursor-pointer items-center">
<input checked="" class="peer sr-only" type="checkbox" value=""/>
<div class="peer h-7 w-12 rounded-full bg-gray-200 dark:bg-white/20 after:absolute after:top-1 after:left-1 after:h-5 after:w-5 after:rounded-full after:border after:border-gray-300 after:bg-white after:transition-all after:content-[''] peer-checked:bg-primary peer-checked:after:translate-x-full peer-checked:after:border-white peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary/50 dark:border-gray-600"></div>
</label>
</div>
</div>
</div>
<!-- Spacer to push buttons to the bottom -->
<div class="flex-grow"></div>
<!-- Action Buttons Area -->
<div class="mt-8 space-y-4">
<button class="flex w-full items-center justify-center rounded-xl bg-primary px-6 py-4 text-center text-base font-bold text-black shadow-sm hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 dark:focus:ring-offset-background-dark">
                    Save Task
                </button>
<button class="flex w-full items-center justify-center rounded-xl bg-transparent px-6 py-4 text-center text-base font-bold text-[#FF8A80] hover:bg-red-500/10 focus:outline-none focus:ring-2 focus:ring-[#FF8A80]/50 focus:ring-offset-2 dark:focus:ring-offset-background-dark">
                    Delete Task
                </button>
</div>
</div>
</div>
</body></html>
