<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">

        darkMode: "class",

              "background-dark": "#0f1723",
              "secondary": "#001d4a",
              "accent": "#00c6a8"

            fontFamily: {
              "display": ["Inter", "sans-serif"]

            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24

</head>

<div class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root" style='font-family: Inter, "Noto Sans", sans-serif;'>

<div class="flex flex-1 items-stretch">

<div class="flex flex-col items-center justify-center gap-8">

</div>
</div>
</div>
<div class="flex flex-1 flex-col items-center justify-center p-4 sm:p-8">
<div class="flex w-full max-w-md flex-col gap-8">

<svg class="text-primary" fill="none" height="32" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"></path><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"></path><path d="M2 7h20"></path><path d="M22 7v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7"></path></svg>

<div class="flex w-full flex-1 items-stretch rounded-lg border border-[#cdd8ea] dark:border-gray-600 focus-within:ring-2 focus-within:ring-primary/50 focus-within:border-primary">

<button aria-label="Toggle password visibility" class="text-[#4568a1] dark:text-gray-400 flex items-center justify-center pr-3 rounded-r-lg">
<span class="material-symbols-outlined" data-icon="Eye" data-size="24px" data-weight="regular">visibility</span>
</button>

</label>

<span class="truncate">Log In</span>
</button>
<p class="text-center text-sm text-[#4568a1] dark:text-gray-400">

</div>
