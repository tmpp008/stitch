<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Note Detail/Edit Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#BDB2FF",
              "background-light": "#F8F7FF",
              "background-dark": "#101a22",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<header class="flex items-center p-4 pb-2 justify-between sticky top-0 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm z-10">
<div class="flex w-12 items-center">
<a href="notes.html" class="flex items-center justify-center h-12 w-12 rounded-full text-zinc-600 dark:text-zinc-300">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</a>
</div>
<h1 class="text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center text-zinc-800 dark:text-zinc-100">Edit Note</h1>
<div class="flex w-12 items-center justify-end">
<button class="flex items-center justify-center h-12 w-12 rounded-full text-zinc-600 dark:text-zinc-300">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</header>
<main class="flex flex-col gap-4 p-4 pt-2 flex-grow">
<!-- Title TextField -->
<div class="flex max-w-[480px] flex-wrap items-end gap-4">
<label class="flex flex-col min-w-40 flex-1">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-zinc-800 dark:text-zinc-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 h-14 placeholder:text-zinc-400 dark:placeholder:text-zinc-500 p-4 text-xl font-bold leading-normal" placeholder="Title" value="Team meeting notes"/>
</label>
</div>
<!-- Rich Text Editor -->
<div class="flex max-w-[480px] flex-wrap items-end gap-4 flex-grow">
<label class="flex flex-col min-w-40 flex-1 h-full">
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-zinc-700 dark:text-zinc-300 focus:outline-0 focus:ring-2 focus:ring-primary/50 border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 min-h-60 placeholder:text-zinc-400 dark:placeholder:text-zinc-500 p-4 text-base font-normal leading-relaxed" placeholder="Start writing...">- Discussed Q3 roadmap and new feature prioritization.
- Alice to follow up on the design system updates.
- Bob will prepare the presentation for the stakeholders.</textarea>
</label>
</div>
<!-- Options Card -->
<div class="bg-white dark:bg-zinc-800 rounded-xl p-4 flex flex-col gap-4 border border-zinc-200 dark:border-zinc-700">
<!-- Pin Note ListItem -->
<div class="flex items-center gap-4 min-h-14 justify-between">
<div class="flex items-center gap-4">
<div class="text-zinc-600 dark:text-zinc-300 flex items-center justify-center rounded-full bg-zinc-100 dark:bg-zinc-700 shrink-0 size-10">
<span class="material-symbols-outlined">push_pin</span>
</div>
<p class="text-zinc-800 dark:text-zinc-100 text-base font-medium leading-normal flex-1 truncate">Pin Note</p>
</div>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-zinc-200 dark:bg-zinc-700 p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary">
<div class="h-full w-[27px] rounded-full bg-white transition-transform"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
<div class="h-px bg-zinc-200 dark:bg-zinc-700"></div>
<!-- Color Label -->
<div>
<h3 class="text-zinc-800 dark:text-zinc-100 text-base font-medium leading-tight mb-3">Color Label</h3>
<div class="flex items-center gap-3 overflow-x-auto pb-2 -mb-2">
<button class="size-8 rounded-full bg-transparent border-2 border-primary ring-2 ring-primary/30 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary text-base">check</span>
</button>
<button class="size-8 rounded-full bg-[#A7F3D0] shrink-0 border-2 border-transparent hover:border-zinc-400"></button>
<button class="size-8 rounded-full bg-[#BFDBFE] shrink-0 border-2 border-transparent hover:border-zinc-400"></button>
<button class="size-8 rounded-full bg-[#FDE68A] shrink-0 border-2 border-transparent hover:border-zinc-400"></button>
<button class="size-8 rounded-full bg-[#FECACA] shrink-0 border-2 border-transparent hover:border-zinc-400"></button>
<button class="size-8 rounded-full bg-[#E5E7EB] shrink-0 border-2 border-transparent hover:border-zinc-400"></button>
<button class="size-8 rounded-full border border-dashed border-zinc-400 dark:border-zinc-600 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-zinc-400 dark:text-zinc-500 text-base">palette</span>
</button>
</div>
</div>
</div>
</main>
<!-- Floating Action Button -->
<div class="fixed bottom-6 right-6 z-20">
<button class="flex items-center justify-center size-14 rounded-full bg-primary text-white shadow-lg shadow-primary/30 hover:bg-primary/90 transition-colors">
<span class="material-symbols-outlined">check</span>
</button>
</div>
<!-- Formatting Toolbar -->
<div class="sticky bottom-0 left-0 right-0 p-4 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
<div class="bg-white dark:bg-zinc-800 rounded-xl p-2 flex items-center justify-center gap-2 border border-zinc-200 dark:border-zinc-700 shadow-lg max-w-sm mx-auto">
<button class="flex-1 flex items-center justify-center h-10 rounded-lg text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-700">
<span class="material-symbols-outlined">format_bold</span>
</button>
<button class="flex-1 flex items-center justify-center h-10 rounded-lg text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-700">
<span class="material-symbols-outlined">format_italic</span>
</button>
<button class="flex-1 flex items-center justify-center h-10 rounded-lg text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-700">
<span class="material-symbols-outlined">format_list_bulleted</span>
</button>
</div>
</div>
</div>
</body></html>
